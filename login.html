<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
        }

        /* LEFT SIDE (FOOD IMAGES) */

        .left {
            width: 50%;
            background: url("https://images.unsplash.com/photo-1504674900247-0877df9cc836") no-repeat center;
            background-size: cover;
            position: relative;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
        }

        .overlay h1 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .overlay p {
            font-size: 18px;
        }

        /* RIGHT SIDE (LOGIN FORM) */

        .right {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(120deg, #d383f5, #74ebd5);
        }

        .login-box {
            width: 350px;
            padding: 40px;
            text-align: center;
            color: white;
        }

        .login-box h2 {
            margin-bottom: 30px;
            font-weight: 300;
            letter-spacing: 2px;
        }

        .input-box {
            margin-bottom: 25px;
        }

        .input-box input {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: none;
            border-bottom: 2px solid white;
            outline: none;
            color: white;
            font-size: 16px;
        }

        .input-box input::placeholder {
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #3b5c85;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #2c4a70;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 15px;
        }
    </style>

</head>

<body>

    <!-- LEFT SIDE -->
    <div class="left">
        <div class="overlay">
            <h1>Delicious Food 🍕</h1>
            <p>Order your favorite meals anytime, anywhere!</p>
        </div>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right">
        <div class="login-box">
            <div class="icon">👤</div>
            <h2>User Login</h2>

            <!-- FIXED FORM -->
            <form action="signup.html" onsubmit="return loginUser()">
                <div class="input-box">
                    <input type="text" placeholder="Username" required>
                </div>

                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                </div>

                <button type="submit">Login Here</button><br><br>
                <p>Don't have an account? <a href="signup.html">Signup</a></p>
            </form>
        </div>
    </div>

    <script>
        function loginUser() {
            let enteredUser = document.querySelector("input[type='text']").value;
            let enteredPass = document.querySelector("input[type='password']").value;

            let storedUser = localStorage.getItem("username");
            let storedPass = localStorage.getItem("password");

            if (enteredUser === storedUser && enteredPass === storedPass) {
                alert("Login Successful!");
                window.location.href = "home.html"; // go to home page
            } else {
                alert("No account Found Please Signup");
            }

            return false;
        }
    </script>

</body>

</html>
